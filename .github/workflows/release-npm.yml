name: Release npm package

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun install --frozen-lockfile
      - name: Verify tag, branch, and worktree
        run: bun run scripts/check-release-state.ts "${GITHUB_REF_NAME}"
      - run: bun run acceptance
      - run: bun run --cwd packages/nearly-headless-cms build:determinism
      - run: bun run --cwd packages/nearly-headless-cms readme:verify
      - run: bun run --cwd packages/nearly-headless-cms package:inspect
      - run: PACKAGE_ARCHIVE="$PWD/.artifacts/npm/nearly-headless-cms-0.1.0.tgz" bun run --cwd packages/nearly-headless-cms package:smoke
      - run: PACKAGE_ARCHIVE="$PWD/.artifacts/npm/nearly-headless-cms-0.1.0.tgz" bun run --cwd packages/nearly-headless-cms publish:dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: nearly-headless-cms-npm-candidate
          path: .artifacts/npm/
          if-no-files-found: error

  filesystem:
    strategy:
      fail-fast: false
      matrix:
        operating-system: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.operating-system }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun install --frozen-lockfile
      - run: bun run test:filesystem

  portable-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - uses: actions/download-artifact@v4
        with:
          name: nearly-headless-cms-npm-candidate
          path: .artifacts/npm
      - name: Smoke exact archive with Node and Bun
        env:
          PACKAGE_ARCHIVE: ${{ github.workspace }}/.artifacts/npm/nearly-headless-cms-0.1.0.tgz
        run: bun run --cwd packages/nearly-headless-cms package:smoke

  publish:
    needs: [build, filesystem, portable-smoke]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - uses: actions/download-artifact@v4
        with:
          name: nearly-headless-cms-npm-candidate
          path: .artifacts/npm
      - name: Publish exact approved archive
        env:
          CONFIRM_NPM_RELEASE: nearly-headless-cms@0.1.0
          PACKAGE_ARCHIVE: ${{ github.workspace }}/.artifacts/npm/nearly-headless-cms-0.1.0.tgz
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run --cwd packages/nearly-headless-cms release:npm
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: packages/nearly-headless-cms/CHANGELOG.md
