name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run --filter nearly-headless-cms build
      - run: bun lint
      - name: Build Public Blog static output
        run: PUBLIC_BLOG_USE_FIXTURE=1 bun run --cwd apps/public-blog build
      - run: bun test
