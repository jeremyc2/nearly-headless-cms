name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run --filter nearly-headless-cms build
      - run: bun lint
      - name: Build Public Blog static output
        run: |
          bun run --cwd apps/example-cms start &
          example_cms_pid=$!
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:3000/health >/dev/null; then
              break
            fi
            if ! kill -0 "$example_cms_pid" 2>/dev/null; then
              echo "Example CMS exited before becoming healthy"
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for Example CMS"
              exit 1
            fi
            sleep 1
          done
          bun run --cwd apps/public-blog build
          kill "$example_cms_pid"
          wait "$example_cms_pid" 2>/dev/null || true
      - run: bun test
